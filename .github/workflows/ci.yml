name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to full commit SHAs, so a moved or compromised tag can't change what runs.
# Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      # No package here needs an install script, so none are allowed to run.
      - run: npm ci --ignore-scripts
      - name: Lint (ESLint, with accessibility and React hooks rules)
        run: npm run lint
      - name: Check formatting (Prettier)
        run: npm run format:check
      - name: Check the packages the site ships for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Unit and screen reader behavior tests (Vitest, Testing Library)
        run: npm test
      - name: Build the one-file copy, which the browser tests also open
        run: npm run build:single
      - run: npx playwright install --with-deps chromium
      - name: Accessibility, language, security and reliability checks in a real browser (Playwright, axe-core)
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Publishes only when every check passed.
  publish:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the site, plus the one-file copy that opens with a double-click
        run: npm run build && npm run build:single && cp skin-editor.html dist/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
